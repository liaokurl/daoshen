name: 資料來源探測
on:
  workflow_dispatch:
    inputs:
      script:
        description: "要執行的檢查程式"
        required: false
        default: "probe.mjs"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/${{ github.event.inputs.script || 'probe.mjs' }}
      - name: 存結果
        run: |
          git config user.name "daoshen-bot"
          git config user.email "daoshen-bot@users.noreply.github.com"
          git add -f probe/
          git commit -m "探測結果" && git pull --rebase && git push
