name: 資料來源探測
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/probe.json
